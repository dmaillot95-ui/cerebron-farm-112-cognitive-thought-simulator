name: CEREBRON F112 strategy benchmark
on:
  push:
    paths: ["worker/strategy_benchmark.py", ".github/workflows/strategy-benchmark.yml"]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python worker/strategy_benchmark.py
      - uses: actions/upload-artifact@v4
        with: {name: f112-strategy-benchmark, path: artifacts/strategy_benchmark.json}
